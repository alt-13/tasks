name: Fork iOS build

# Lives only on this fork's default branch `fork-tools`, together with
# scripts/patch_ios_for_fork.py. Never part of a PR to tasks/tasks.
#
# Builds any branch of this fork on a GitHub-hosted Mac:
#   gh workflow run fork-ios.yml -f ref=ios/c3-ios-notifier
#   gh workflow run fork-ios.yml -f ref=ios/c3-ios-notifier -f testflight=true -f tests=false
#   gh run watch
#
# Setup (secrets, variables, colleague's one-time steps): plan_to_release.md §1.4.

run-name: "iOS ${{ inputs.ref }}${{ inputs.testflight && ' → TestFlight' || '' }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit of this fork to build
        required: true
        default: main
      tests:
        description: Run the iOS simulator test suites (same tasks as upstream check.yml)
        type: boolean
        default: true
      smoke:
        description: Build Debug for the simulator, launch it, save a screenshot and logs
        type: boolean
        default: true
      testflight:
        description: Archive, sign and upload to TestFlight (needs secrets and variables)
        type: boolean
        default: false
      unsigned_ipa:
        description: Build an unsigned .ipa for sideloading (Sideloadly / AltStore)
        type: boolean
        default: false
      upload_via:
        description: TestFlight upload tool (switch if Apple changes altool)
        type: choice
        options: [altool, xcodebuild]
        default: altool
      xcode:
        description: Xcode major version (keep in sync with upstream check.yml)
        default: "26"

permissions:
  contents: read

env:
  PROJECT: iosApp/iosApp.xcodeproj
  SCHEME: iosApp
  XCODE_MAJOR: ${{ inputs.xcode }}
  TARGET_REF: ${{ inputs.ref }}

jobs:
  tests:
    if: inputs.tests
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Select Xcode
        run: |
          XCODE="$(find /Applications -maxdepth 1 -name "Xcode_${XCODE_MAJOR}*.app" | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then echo "::error::No Xcode ${XCODE_MAJOR} on this runner image"; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Boot a simulator
        run: |
          # Only the runtime matching the selected Xcode's SDK is a valid xcodebuild destination.
          RUNTIME="iOS-$(xcrun --sdk iphonesimulator --show-sdk-version | tr . -)"
          UDID="$(xcrun simctl list devices available -j | jq -r --arg rt "$RUNTIME" '[.devices | to_entries[] | select(.key | endswith($rt)) | .value[] | select(.name | test("^iPhone [0-9]+$"))] | last | .udid // empty')"
          if [ -z "$UDID" ]; then echo "::error::No iPhone simulator for runtime $RUNTIME"; xcrun simctl list runtimes; exit 1; fi
          xcrun simctl boot "$UDID"

      - name: Build for iOS and run simulator tests
        run: ./gradlew :composeApp:compileKotlinIosArm64 :data:iosSimulatorArm64Test :kmp:iosSimulatorArm64Test :composeApp:iosSimulatorArm64Test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-ios-${{ github.run_number }}
          path: |
            data/build/reports/**
            kmp/build/reports/**
            composeApp/build/reports/**

  smoke:
    if: inputs.smoke
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Check out fork tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .fork-tools

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Select Xcode
        run: |
          XCODE="$(find /Applications -maxdepth 1 -name "Xcode_${XCODE_MAJOR}*.app" | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then echo "::error::No Xcode ${XCODE_MAJOR} on this runner image"; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Apply fork-build patches (not committed)
        run: python3 .fork-tools/scripts/patch_ios_for_fork.py --disable-crash-reporting

      - name: Boot a simulator
        run: |
          # Only the runtime matching the selected Xcode's SDK is a valid xcodebuild destination.
          RUNTIME="iOS-$(xcrun --sdk iphonesimulator --show-sdk-version | tr . -)"
          UDID="$(xcrun simctl list devices available -j | jq -r --arg rt "$RUNTIME" '[.devices | to_entries[] | select(.key | endswith($rt)) | .value[] | select(.name | test("^iPhone [0-9]+$"))] | last | .udid // empty')"
          if [ -z "$UDID" ]; then echo "::error::No iPhone simulator for runtime $RUNTIME"; xcrun simctl list runtimes; exit 1; fi
          xcrun simctl boot "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Debug \
            -sdk iphonesimulator -destination "id=$UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Launch, screenshot, collect logs
        run: |
          OUT="$RUNNER_TEMP/smoke"
          mkdir -p "$OUT"
          APP="$(find "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)"
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          PROCESS="$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE"
          sleep 30
          xcrun simctl io "$UDID" screenshot "$OUT/after-launch.png"
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate "process == \"$PROCESS\"" > "$OUT/app.log" 2>&1 || true
          cp ~/Library/Logs/DiagnosticReports/*.ips "$OUT/" 2>/dev/null || true
          if xcrun simctl spawn "$UDID" launchctl list | grep -q "UIKitApplication:$BUNDLE"; then
            echo "App still running 30 s after launch."
          else
            echo "::error::App is not running 30 s after launch (crash?). See the smoke artifact."
            exit 1
          fi

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/smoke/**
            ${{ runner.temp }}/build.log

  unsigned-ipa:
    if: inputs.unsigned_ipa
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Check out fork tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .fork-tools

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Select Xcode
        run: |
          XCODE="$(find /Applications -maxdepth 1 -name "Xcode_${XCODE_MAJOR}*.app" | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then echo "::error::No Xcode ${XCODE_MAJOR} on this runner image"; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Apply fork-build patches (not committed)
        run: python3 .fork-tools/scripts/patch_ios_for_fork.py --disable-crash-reporting

      - name: Archive without signing
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tasks.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Package .ipa
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R Tasks.xcarchive/Products/Applications/*.app Payload/
          zip -qry "tasks-unsigned-${GITHUB_RUN_NUMBER}.ipa" Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v7
        with:
          name: tasks-unsigned-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/tasks-unsigned-*.ipa

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-ipa-logs-${{ github.run_number }}
          path: ${{ runner.temp }}/archive.log

  testflight:
    if: inputs.testflight
    runs-on: macos-latest
    timeout-minutes: 150
    concurrency:
      group: fork-ios-testflight
      cancel-in-progress: false
    env:
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Check configuration
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          missing=""
          for name in IOS_TEAM_ID IOS_BUNDLE_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD IOS_PROFILE; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables/secrets:$missing (see plan_to_release.md §1.4)"
            exit 1
          fi
          if [ "$IOS_BUNDLE_ID" = "org.tasks" ]; then
            echo "::error::IOS_BUNDLE_ID must be the dev bundle ID from your colleague's team, not org.tasks"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Check out fork tools
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .fork-tools

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Cache Kotlin/Native
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Select Xcode
        run: |
          XCODE="$(find /Applications -maxdepth 1 -name "Xcode_${XCODE_MAJOR}*.app" | sort -V | tail -1)"
          if [ -z "$XCODE" ]; then echo "::error::No Xcode ${XCODE_MAJOR} on this runner image"; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install signing certificate and provisioning profile
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/fork-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution"; then
            echo "::error::IOS_DIST_CERT_P12 does not contain an 'Apple Distribution' identity with its private key"
            exit 1
          fi
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          PROFILE="$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "$IOS_PROFILE" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          pb() { /usr/libexec/PlistBuddy -c "Print $1" "$RUNNER_TEMP/profile.plist"; }
          PROFILE_UUID="$(pb UUID)"
          PROFILE_NAME="$(pb Name)"
          APP_ID="$(pb Entitlements:application-identifier)"
          if [ "$APP_ID" != "$IOS_TEAM_ID.$IOS_BUNDLE_ID" ]; then
            echo "::error::Profile is for $APP_ID, expected $IOS_TEAM_ID.$IOS_BUNDLE_ID"
            exit 1
          fi
          if [ "$(pb Entitlements:get-task-allow)" != "false" ]; then
            echo "::error::IOS_PROFILE is a development profile; an App Store Connect distribution profile is needed"
            exit 1
          fi
          pb Entitlements:aps-environment > /dev/null 2>&1 || echo "::warning::Profile lacks Push Notifications; the build will fail to sign"
          pb Entitlements:com.apple.developer.applesignin > /dev/null 2>&1 || echo "::warning::Profile lacks Sign in with Apple; the build will fail to sign"
          echo "Using profile '$PROFILE_NAME' ($PROFILE_UUID), expires $(pb ExpirationDate)"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE" "$dir/$PROFILE_UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Apply fork-build patches (not committed)
        run: |
          python3 .fork-tools/scripts/patch_ios_for_fork.py \
            --disable-crash-reporting \
            --manual-signing "$PROFILE_NAME" \
            --export-compliance-exempt
          # Local.xcconfig is git-ignored and included last by Config.xcconfig.
          # Build number: <VERSION_CODE>.<run number>, so every upload is higher than the last.
          cat > iosApp/Configuration/Local.xcconfig <<EOF
          TEAM_ID = $IOS_TEAM_ID
          BUNDLE_ID = $IOS_BUNDLE_ID
          CURRENT_PROJECT_VERSION = \$(VERSION_CODE).$GITHUB_RUN_NUMBER
          EOF
          cat iosApp/Configuration/Local.xcconfig
          git diff --stat

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tasks.xcarchive" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Export .ipa
        run: |
          python3 - <<'PY'
          import os
          import plistlib

          options = {
              "method": "app-store-connect",
              "teamID": os.environ["IOS_TEAM_ID"],
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": {os.environ["IOS_BUNDLE_ID"]: os.environ["PROFILE_NAME"]},
              "uploadSymbols": True,
              "manageAppVersionAndBuildNumber": False,
          }
          tmp = os.environ["RUNNER_TEMP"]
          with open(f"{tmp}/export.plist", "wb") as f:
              plistlib.dump({**options, "destination": "export"}, f)
          with open(f"{tmp}/upload.plist", "wb") as f:
              plistlib.dump({**options, "destination": "upload"}, f)
          PY
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tasks.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" 2>&1 | tee "$RUNNER_TEMP/export.log"
          ls -l "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          UPLOAD_VIA: ${{ inputs.upload_via }}
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_FILE="$KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY_FILE"
          if [ "$UPLOAD_VIA" = "altool" ]; then
            IPA="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)"
            xcrun altool --upload-app --type ios --file "$IPA" \
              --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          else
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/Tasks.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/upload.plist" \
              -exportPath "$RUNNER_TEMP/upload" \
              -authenticationKeyPath "$KEY_FILE" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          fi

      - name: Summary
        run: |
          INFO="$(find "$RUNNER_TEMP/Tasks.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)/Info.plist"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$INFO")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$INFO")"
          {
            echo "### Uploaded to TestFlight"
            echo "- Ref: \`$TARGET_REF\` ($(git rev-parse --short HEAD))"
            echo "- Version: $VERSION ($BUILD)"
            echo "- Bundle ID: \`$IOS_BUNDLE_ID\`"
            echo ""
            echo "App Store Connect needs a few minutes to process the build before it appears in TestFlight."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testflight-logs-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore

      - name: Remove signing material
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf "$HOME/.appstoreconnect" \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" \
            "$RUNNER_TEMP/app.mobileprovision" "$RUNNER_TEMP/profile.plist"
